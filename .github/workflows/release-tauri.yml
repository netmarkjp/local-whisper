name: Release Tauri App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    # Only release from version tags; a workflow_dispatch on a branch would otherwise
    # publish a signed release tagged with the branch name.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-15
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup toolchain (mise)
        uses: jdx/mise-action@v5.2.9
        with:
          # Pin the mise binary itself (macOS arm64 raw binary, from the release's SHASUMS256.txt).
          # mise v2026.11.9 was released 2026-11-16 (>=3 days old). `minimum_release_age` only
          # applies when `version` is unset, so it is not needed here. Tool versions are pinned in mise.toml.
          version: 2026.11.9
          sha256: f3bb0e8cbe0217a0b52444ecc0042364563ddd1de0490313bb7e702ecab41a14
          # This job holds signing secrets: never restore toolchains from the Actions cache.
          cache: false

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          mkdir -p private_keys
          echo "${{ secrets.APPLE_API_KEY_CONTENT_BASE64 }}" | base64 --decode > "private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"
          chmod 600 "private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"
          echo "APPLE_API_KEY_PATH=${GITHUB_WORKSPACE}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8" >> "$GITHUB_ENV"

      - name: Build, Sign, Notarize and Release (macOS)
        uses: tauri-apps/tauri-action@v1.0.0
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: local-whisper ${{ github.ref_name }}
          releaseBody: |
            Automated release for ${{ github.ref_name }}.
          releaseDraft: false
          prerelease: false
          # Arguments after `--` are forwarded to cargo; keep Cargo.lock untouched.
          args: -- --locked
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Apple code signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

          # APPLE_SIGNING_IDENTITY is optional in Tauri v2 when inferable from APPLE_CERTIFICATE.
          # If needed, uncomment the next line and set the secret.
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

          # Apple notarization via App Store Connect API key (recommended)
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
